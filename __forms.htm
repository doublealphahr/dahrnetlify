<!DOCTYPE html>
<html>
<head><title>Form Skeleton</title></head>
<body>
  <!-- 英文版表单骨架 -->
  <form name="cv_upload" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="cv_upload" />
    <input name="bot-field" />
    <input name="fullName" />
    <input name="email" />
    <input name="phone" />
    <input name="location" />
    <select name="degree"></select>
    <input name="school" />
    <input name="major" />
    <input name="graduationYear" />
    <textarea name="workExperience"></textarea>
    <input type="file" name="resumeFile" />
  </form>

  <!-- 中文版表单骨架 -->
  <form name="cv_upload_cn" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="cv_upload_cn" />
    <input name="bot-field" />
    <input name="fullName" />
    <input name="email" />
    <input name="phone" />
    <input name="location" />
    <select name="degree"></select>
    <input name="school" />
    <input name="major" />
    <input name="graduationYear" />
    <textarea name="workExperience"></textarea>
    <input type="file" name="resumeFile" />
  </form>
</body>
</html>
