<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Language" content="zh-cn" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>简历上传表单 | Double Alpha HR Consulting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #eef5f9 0%, #dce8f0 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, "Microsoft YaHei", sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .main-card {
            width: 99%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-radius: 0; box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            padding: 2.2rem 2.4rem 2.5rem; transition: all 0.2s;
        }
        .hidden { display: none !important; }
        /* ===== CAPTCHA ===== */
        .captcha-container { text-align: center; padding: 0.5rem 0 1rem; }
        .captcha-icon { font-size: 4rem; margin-bottom: 1.2rem; filter: drop-shadow(0 8px 12px rgba(31, 139, 107, 0.2)); }
        .captcha-sub { color: #3e6d82; font-size: 0.95rem; margin-bottom: 2rem; background: #eef6fa; display: inline-block; padding: 0.4rem 1.4rem; border-radius: 40px; border: 1px solid #cbe0ea; }
        .captcha-box { background: #f8fcfe; border-radius: 1.8rem; padding: 2rem 1.8rem 2.2rem; border: 1px solid #dae9f2; box-shadow: 0 4px 12px rgba(0, 20, 30, 0.02); max-width: 50%; margin: 0 auto; }
        .captcha-question { font-size: 2.4rem; font-weight: 600; color: #1a4c5e; margin-bottom: 1.6rem; letter-spacing: 0.5px; background: white; padding: 0.8rem 1rem; border-radius: 60px; border: 1.5px solid #d3e3ec; display: inline-block; min-width: 180px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .captcha-input-area { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
        .captcha-input-area input { width: 100%; max-width: 260px; padding: 1rem 1.4rem; font-size: 1.2rem; text-align: center; border: 2px solid #d3e3ec; border-radius: 60px; outline: none; transition: all 0.2s ease; font-weight: 500; color: #0b2d3b; background: white; }
        .captcha-input-area input:focus { border-color: #3ba3c7; box-shadow: 0 0 0 4px rgba(59, 163, 199, 0.12); }
        .captcha-input-area input.error { border-color: #e07a7a; background: #fef8f8; }
        .captcha-error { color: #c0392b; font-size: 0.85rem; min-height: 1.2rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 0.2rem; }
        .captcha-error:not(:empty)::before { content: "⚠️"; font-size: 0.8rem; }
        .captcha-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 0.6rem; flex-wrap: wrap; }
        .btn-captcha { background: #1f8b6b; color: white; border: none; border-radius: 60px; padding: 0.9rem 2rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.18s ease; box-shadow: 0 10px 20px -8px rgba(31, 139, 107, 0.4); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: inherit; min-width: 140px; }
        .btn-captcha:hover { background: #157a5b; transform: translateY(-1px); box-shadow: 0 14px 24px -10px rgba(31, 139, 107, 0.5); }
        .btn-captcha.refresh { background: white; color: #1c4c5e; border: 1.5px solid #c2dae8; box-shadow: none; min-width: 120px; }
        .btn-captcha.refresh:hover { background: #eef6fa; border-color: #8ec9de; }
        /* ===== Resume Form ===== */
        .resume-card { background: transparent; box-shadow: none; padding: 0; max-width: 99%; }
        .header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
        .header h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -0.02em; color: #0b2d3b; display: flex; align-items: center; gap: 0.6rem; }
        .required-note { font-size: 0.8rem; color: #5e8497; background: #eef6fa; padding: 0.35rem 1.1rem; border-radius: 30px; border: 1px solid #cbe0ea; display: flex; align-items: center; gap: 0.3rem; }
        .required-note .asterisk { color: #d9534f; font-weight: 700; font-size: 1rem; }
        .form-section { margin-bottom: 2rem; background: #f8fcfe; border-radius: 1.5rem; padding: 1.5rem 1.7rem 1.8rem; border: 1px solid #dae9f2; box-shadow: 0 2px 8px rgba(0, 20, 30, 0.02); transition: all 0.15s; }
        .section-title { font-size: 1.15rem; font-weight: 600; color: #0b2d3b; margin-bottom: 1.3rem; display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.6rem; border-bottom: 2px solid #d4e6f0; }
        .section-title .icon { font-size: 1.3rem; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem 1.3rem; }
        .form-grid .full-width { grid-column: 1 / -1; }
        .input-group { display: flex; flex-direction: column; gap: 0.35rem; }
        .input-group label { font-size: 0.85rem; font-weight: 500; color: #1c4c5e; display: flex; align-items: center; gap: 0.2rem; }
        .input-group label .req { color: #d9534f; font-weight: 700; margin-left: 2px; }
        .input-group input, .input-group select, .input-group textarea { padding: 0.8rem 1rem; font-size: 0.95rem; border: 1.5px solid #d3e3ec; border-radius: 16px; background: white; outline: none; transition: all 0.2s ease; color: #0b2d3b; font-family: inherit; width: 100%; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: #3ba3c7; box-shadow: 0 0 0 4px rgba(59, 163, 199, 0.12); }
        .input-group textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
        .input-group.error input, .input-group.error select, .input-group.error textarea { border-color: #e07a7a; background: #fef8f8; }
        .error-message { font-size: 0.75rem; color: #c0392b; min-height: 1.1rem; display: flex; align-items: center; gap: 0.2rem; padding-left: 0.2rem; }
        .error-message:not(:empty)::before { content: "⚠️"; font-size: 0.7rem; }
        .submit-area { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; margin-top: 1.2rem; flex-wrap: wrap; }
        .btn { border: none; border-radius: 60px; padding: 0.95rem 2.2rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.18s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; font-family: inherit; }
        .btn-primary { background: #1f8b6b; color: white; box-shadow: 0 10px 20px -8px rgba(31, 139, 107, 0.4); flex: 1; min-width: 180px; }
        .btn-primary:hover { background: #157a5b; transform: translateY(-1px); }
        .btn-secondary { background: white; color: #1c4c5e; border: 1.5px solid #c2dae8; }
        .btn-secondary:hover { background: #eef6fa; border-color: #8ec9de; }
        .btn:disabled { opacity: 0.55; pointer-events: none; filter: grayscale(0.2); }
        .success-message { background: #e3f5ef; color: #0d6b4d; padding: 1rem 1.5rem; border-radius: 1.2rem; font-weight: 500; display: flex; align-items: center; gap: 0.7rem; border: 1px solid #a8d5c4; margin-top: 1.5rem; animation: fadeSlideIn 0.4s ease; box-shadow: 0 4px 12px rgba(31, 139, 107, 0.1); }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .success-message .big-icon { font-size: 1.6rem; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .file-upload-area { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .file-label { background: white; border: 1.5px dashed #b8d4e3; border-radius: 16px; padding: 0.8rem 1.5rem; font-size: 0.9rem; color: #2f6d88; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 0.5rem; }
        .file-label:hover { border-color: #3ba3c7; background: #f2fbff; }
        .file-name { font-size: 0.85rem; color: #4d7a90; }
        .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            body { padding: 0.6rem; } .main-card { padding: 1.3rem 1.1rem 1.6rem; border-radius: 1rem; }
            .captcha-box { max-width: 100%; padding: 1.5rem 1rem 1.8rem; }
            .form-grid { grid-template-columns: 1fr; gap: 0.85rem; }
            .form-section { padding: 1.1rem 0.95rem 1.2rem; }
            .file-upload-area { flex-direction: column; align-items: stretch; gap: 0.6rem; }
            .file-label { justify-content: center; }
            .submit-area { flex-direction: column; gap: 0.7rem; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <!-- ===== 验证码 ===== -->
        <div id="captchaSection" class="captcha-container">
            <div class="captcha-icon"><strong>🧑‍💻</strong> <strong>真人验证</strong></div>
            <div class="captcha-sub">请回答以下问题以继续</div>
            <div class="captcha-box">
                <div class="captcha-question" id="captchaQuestion">3 + 5 = ?</div>
                <div class="captcha-input-area">
                    <input type="text" id="captchaAnswer" placeholder="请输入答案" inputmode="numeric" autocomplete="off">
                    <div class="captcha-error" id="captchaError"></div>
                    <div class="captcha-actions">
                        <button class="btn-captcha" id="captchaVerifyBtn">✓ 验证</button>
                        <button class="btn-captcha refresh" id="captchaRefreshBtn">⟲ 换一题</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 表单 (Netlify Forms) ===== -->
        <div id="resumeSection" class="hidden">
            <div class="resume-card">
                <div class="header">
                    <h1>📋 提交您的简历</h1>
                    <div class="required-note"><span class="asterisk">*</span> 为必填项</div>
                </div>

                <form id="resumeForm" name="cv_upload_cn" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" novalidate>
                    <input type="hidden" name="form-name" value="cv_upload_cn">
                    <p class="visually-hidden">
                        <label>请勿填写此字段: <input name="bot-field" /></label>
                    </p>

                    <div class="form-section">
                        <div class="section-title"><span class="icon">👤</span> 个人信息</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="fullName">您的姓名 <span class="req">*</span></label>
                                <input type="text" id="fullName" name="fullName" placeholder="请输入您的姓名" required>
                            </div>
                            <div class="input-group">
                                <label for="email">邮箱地址 <span class="req">*</span></label>
                                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                            <div class="input-group">
                                <label for="phone">联系电话 <span class="req">*</span></label>
                                <input type="tel" id="phone" name="phone" placeholder="+86 或 +44 电话号码" required>
                            </div>
                            <div class="input-group">
                                <label for="location">所在城市</label>
                                <input type="text" id="location" name="location" placeholder="例如：伦敦 / 北京">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="section-title"><span class="icon">🎓</span> 教育背景</div>
                        <div class="form-grid">
                            <div class="input-group">
                                <label for="degree">最高学历 <span class="req">*</span></label>
                                <select id="degree" name="degree" required>
                                    <option value="">请选择学历</option>
                                    <option value="College">大专</option>
                                    <option value="Bachelor">本科</option>
                                    <option value="Master">硕士</option>
                                    <option value="PhD">博士</option>
                                    <option value="Other">其他</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label for="school">毕业院校 <span class="req">*</span></label>
                                <input type="text" id="school" name="school" placeholder="例如：牛津大学" required>
                            </div>
                            <div class="input-group">
                                <label for="major">专业</label>
                                <input type="text" id="major" name="major" placeholder="例如：计算机科学">
                            </div>
                            <div class="input-group">
                                <label for="graduationYear">毕业年份</label>
                                <input type="number" id="graduationYear" name="graduationYear" placeholder="例如：2023" min="1950" max="2035">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="section-title"><span class="icon">💼</span> 工作经验</div>
                        <div class="form-grid">
                            <div class="input-group full-width">
                                <label for="workExperience">工作经历简述</label>
                                <textarea id="workExperience" name="workExperience" placeholder="简要描述您的工作经历、项目或成就..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="input-group full-width">
                        <label for="resumeFile">上传简历附件 (PDF / Word, 最大 8 MB)</label>
                        <div class="file-upload-area">
                            <label for="resumeFile" class="file-label"><span>📎</span> 选择文件</label>
                            <input type="file" id="resumeFile" name="resumeFile" accept=".pdf,.doc,.docx" class="visually-hidden" required>
                            <span class="file-name" id="fileName">未选择文件</span>
                        </div>
                    </div>

                    <div class="submit-area">
                        <button type="submit" class="btn btn-primary" id="submitBtn"><span>📤</span> 提交简历</button>
                        <button type="reset" class="btn btn-secondary" id="resetBtn"><span>⟲</span> 重置</button>
                    </div>
                </form>

                <div class="success-message" id="successMessage" style="display: none;">
                    <span class="big-icon">✅</span>
                    <span id="successText">您的简历已成功提交！我们会尽快与您联系。</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ===== 验证码逻辑 ===== */
        (function() {
            const captchaSection = document.getElementById('captchaSection');
            const resumeSection = document.getElementById('resumeSection');
            const captchaQuestion = document.getElementById('captchaQuestion');
            const captchaAnswer = document.getElementById('captchaAnswer');
            const captchaError = document.getElementById('captchaError');
            let currentAnswer = 0;
            function generateCaptcha() {
                const a = Math.floor(Math.random() * 10) + 1;
                const b = Math.floor(Math.random() * 10) + 1;
                currentAnswer = a + b;
                captchaQuestion.textContent = `${a} + ${b} = ?`;
                captchaAnswer.value = ''; captchaAnswer.classList.remove('error'); captchaError.textContent = '';
            }
            function verifyCaptcha() {
                if (Number(captchaAnswer.value.trim()) === currentAnswer) {
                    captchaSection.classList.add('hidden'); resumeSection.classList.remove('hidden');
                } else {
                    captchaError.textContent = '答案错误，请重试。';
                    captchaAnswer.value = ''; captchaAnswer.classList.add('error');
                }
            }
            document.getElementById('captchaRefreshBtn').addEventListener('click', generateCaptcha);
            document.getElementById('captchaVerifyBtn').addEventListener('click', verifyCaptcha);
            captchaAnswer.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); verifyCaptcha(); } });
            generateCaptcha();
        })();

        /* ===== 表单提交 (修复核心) ===== */
        (function() {
            const form = document.getElementById('resumeForm');
            const resumeFile = document.getElementById('resumeFile');
            const fileName = document.getElementById('fileName');
            const successMessage = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');

            resumeFile.addEventListener('change', function() {
                fileName.textContent = this.files.length > 0 ? this.files[0].name : '未选择文件';
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner"></span> 提交中...';

                try {
                    // ★ 核心修复：使用原生 FormData，并发送到 "/"
                    const formData = new FormData(form);
                    const response = await fetch("/", {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        form.reset();
                        fileName.textContent = '未选择文件';
                        successMessage.style.display = 'flex';
                        submitBtn.innerHTML = '<span>✅</span> 提交成功';
                        successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        throw new Error('Network response was not ok');
                    }
                } catch (error) {
                    alert('提交失败，请稍后重试，或直接发送邮件至 business@doublealphahr.com');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>📤</span> 提交简历';
                }
            });

            document.getElementById('resetBtn').addEventListener('click', function() {
                setTimeout(() => {
                    fileName.textContent = '未选择文件';
                    successMessage.style.display = 'none';
                }, 10);
            });
        })();
    </script>
</body>
</html>
