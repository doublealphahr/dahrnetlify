<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources Centre</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #eef5f9, #dce8f0);
      min-height: 100vh; padding: 2rem 1rem; color: #0b2d3b;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1rem; }
    header h1 { font-size: 2rem; font-weight: 700; }
    header .sub { color: #4b5e71; font-size: 0.9rem; margin-top: 0.5rem; }
    .search-box { max-width: 480px; margin: 1.5rem auto 2rem; }
    .search-box input {
      width: 100%; padding: 0.9rem 1.4rem;
      border: 1.5px solid #d3e3ec; border-radius: 60px;
      font-size: 0.95rem; outline: none; background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      border-color: #3ba3c7;
      box-shadow: 0 0 0 4px rgba(59,163,199,0.12);
    }
    .grid {
      display: grid;
      /* 关键修复：使用 min(300px, 100%) 防止窄屏溢出 */
      grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
      gap: 1.5rem;
    }
    .category {
      background: rgba(255,255,255,0.92);
      border-radius: 1.8rem; padding: 1.6rem 1.5rem 1.2rem;
      box-shadow: 0 12px 28px -14px rgba(0,20,30,0.25);
      border: 1px solid rgba(255,255,255,0.7);
    }
    .category-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1rem; padding-bottom: 0.8rem;
      border-bottom: 2px solid #e5eef4;
    }
    .category-header h2 {
      font-size: 1.15rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .count {
      font-size: 0.75rem; font-weight: 600;
      background: #eef4ff; color: #2d5be0;
      padding: 0.25rem 0.75rem; border-radius: 20px;
    }
    .article-list { list-style: none; }
    .article-list li { border-bottom: 1px solid #eef4f8; }
    .article-list li:last-child { border-bottom: none; }
    .article-list a {
      display: flex; align-items: center; gap: 0.7rem;
      padding: 0.75rem 0.4rem; text-decoration: none;
      color: #0b2d3b; border-radius: 8px;
      transition: background 0.15s, transform 0.15s;
    }
    .article-list a:hover {
      background: #f2fbff; transform: translateX(3px);
    }
    .article-list a:hover .title { color: #1f8b6b; }
    .badge {
      font-size: 0.65rem; font-weight: 700;
      padding: 0.15rem 0.5rem; border-radius: 20px;
      text-transform: uppercase; flex-shrink: 0;
    }
    .badge.html { background: #e3f5ef; color: #0d6b4d; }
    .badge.md   { background: #eef4ff; color: #2d5be0; }
    .title {
      flex: 1; font-size: 0.95rem; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; transition: color 0.15s;
    }
    .empty, .loading, .error {
      text-align: center; padding: 1.5rem 0.5rem;
      color: #8aa4b5; font-size: 0.85rem;
    }
    .error { color: #c0392b; }
    mark { background: #ffe58a; padding: 0 2px; border-radius: 3px; }

    /* ============================================= */
    /* ===== 移动端响应式优化 (屏幕宽度 ≤ 768px) ===== */
    /* ============================================= */
    @media (max-width: 768px) {
      body { padding: 1.2rem 0.8rem; }
      header h1 { font-size: 1.5rem; }
      header .sub { font-size: 0.82rem; }

      .search-box { margin: 1rem auto 1.2rem; }
      .search-box input { padding: 0.8rem 1.2rem; font-size: 0.9rem; }

      .grid { grid-template-columns: 1fr; gap: 1rem; }
      .category { padding: 1.2rem 1rem 0.9rem; border-radius: 1.2rem; }
      .category-header { margin-bottom: 0.8rem; padding-bottom: 0.6rem; }
      .category-header h2 { font-size: 1.05rem; }
      .count { font-size: 0.7rem; padding: 0.2rem 0.6rem; }

      .article-list a { padding: 0.85rem 0.4rem; font-size: 0.9rem; }
      .title { font-size: 0.88rem; }
      .badge { font-size: 0.6rem; }
    }

    /* 超窄屏（≤ 360px）再缩一层 */
    @media (max-width: 360px) {
      body { padding: 1rem 0.6rem; }
      header h1 { font-size: 1.3rem; }
      .category { padding: 1rem 0.85rem 0.8rem; }
      .title { font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Resources Centre</h1>
      <p class="sub" id="subInfo">Loading...</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Search article title..">
    </div>

    <div id="content">
      <div class="loading">Loading the articles list...</div>
    </div>
  </div>

  <script>
    let allData = [];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
    function highlight(text, kw) {
      const safe = escapeHtml(text);
      if (!kw) return safe;
      const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      return safe.replace(re, '<mark>$1</mark>');
    }

    function render(kw = '') {
      const contentEl = document.getElementById('content');
      const subEl = document.getElementById('subInfo');
      kw = kw.trim().toLowerCase();

      let totalAll = 0, totalShown = 0;

      const html = allData.map(cat => {
        totalAll += cat.articles.length;
        const list = cat.articles.filter(a =>
          !kw || a.title.toLowerCase().includes(kw) || a.file.toLowerCase().includes(kw)
        );
        totalShown += list.length;

        const body = list.length === 0
          ? `<li class="empty">${cat.articles.length === 0 ? 'No matched article found' : 'No matched result'}</li>`
          : list.map(a => {
              // 静态部署：指向根目录的 Article.html
              var articleDetailUrl = '../Article.html';
              return `<li><a href="${articleDetailUrl}?f=${encodeURIComponent(a.url)}" target="_top">
                <span class="title">${highlight(a.title, kw)}</span>
              </a></li>`;
            }).join('');

        return `<section class="category">
          <div class="category-header">
            <h2><span>${cat.icon}</span>${escapeHtml(cat.label)}</h2>
            <span class="count">${list.length} articles</span>
          </div>
          <ul class="article-list">${body}</ul>
        </section>`;
      }).join('');

      contentEl.innerHTML = `<div class="grid">${html}</div>`;
      subEl.textContent = kw
        ? `Total selected ${totalShown} / Total ${totalAll} articles`
        : `Total ${totalAll} articles, in ${allData.length} categories`;
    }

    async function load() {
      const contentEl = document.getElementById('content');
      try {
        const res = await fetch('../articles.json?t=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allData = data.categories || [];
        render();
      } catch (err) {
        contentEl.innerHTML = `<div class="error">❌ Load failed: ${err.message}<br>
          Please run <code>node generate-list.js</code> first, and confirm that articles.json is located in the root directory of the website.</div>`;
        document.getElementById('subInfo').textContent = 'Load failed';
      }
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      render(this.value);
    });

    load();
  </script>
</body>
</html>
